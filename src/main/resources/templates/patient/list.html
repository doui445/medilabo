<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="~{fragments/head :: head-css}"></th:block>
	<title>Patients</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: headerNav}"></div>
<div class="container">
	<div class="row mb-3">
		<div class="col-6"><h2>Patient List</h2></div>
		<div class="col-6 text-right">
			<a class="btn btn-primary btn-sm" th:href="@{/patient/add}">Add New</a>
		</div>
	</div>

	<div class="row">
		<table class="table table-bordered table-striped">
			<thead>
			<tr>
				<th>Id</th>
				<th>Name</th>
				<th>BirtDate</th>
				<th>Gender</th>
				<th>Address</th>
				<th>Phone</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="patient : ${patients}">
				<td style="width: 10%" th:text="${patient.id}"></td>
				<td style="width: 10%" th:text="|${patient.firstname} ${patient.lastname}|"></td>
				<td style="width: 10%" th:text="${#temporals.format(patient.birthDate, 'dd/MM/yyyy')}"></td>
				<td style="width: 10%" th:text="${patient.gender}"></td>
				<td style="width: 10%" th:text="${patient.address}"></td>
				<td style="width: 10%" th:text="${patient.phone}"></td>
				<td class="text-center" style="width: 15%">
					<a th:href="@{/patient/update/{id}(id=${patient.id})}">Edit</a>&nbsp;|&nbsp;
					<a th:href="@{/patient/delete/{id}(id=${patient.id})}">Delete</a>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
</div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
