<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<th:block th:replace="~{fragments/head :: head-css}"></th:block>
	<title>Update Note</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: headerNav}"></div>

<div class="container">
	<div class="row">
		<h2>Edit Note for <span th:text="${note.patientName}">Patient</span></h2>
	</div>

	<div class="row">
		<form class="form-horizontal" method="post" style="width: 100%"
		      th:action="@{/note/update/{id}(id=${note.id})}" th:object="${note}">

			<div class="form-group">
				<label for="title">Title</label>
				<input class="form-control" id="title" th:field="*{title}" type="text">
			</div>

			<div class="form-group">
				<label for="content">Doctor's Notes <span class="text-danger">*</span></label>
				<textarea class="form-control" id="content" rows="6" th:field="*{content}" required></textarea>
			</div>

			<div class="form-group">
				<div class="col-sm-12">
					<a class="btn btn-secondary" th:href="@{/patient/details/{id}(id=${note.patientId})}">Cancel</a>
					<input class="btn btn-primary btn-sm" type="submit" value="Update Patient">
				</div>
			</div>
		</form>
	</div>
</div>
</body>
</html>
